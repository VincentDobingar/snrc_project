name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "snrc-backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "snrc-backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snrc-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: snrc-backend/package-lock.json
      - run: npm ci
      - run: npm test
